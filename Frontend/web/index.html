<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lecture-Hunter - 강의 상호작용을 위한 실시간 자막·질문 위젯">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lecture Hunter">

  <link rel="apple-touch-icon" href="Lecture-Hunter_Logo5.png">
  <link rel="icon" type="image/png" href="Lecture-Hunter_Logo5.png">

  <title>Lecture Hunter</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 크롬 확장 iframe 안에서는 유튜브 화면이 비쳐 보이도록 배경을 투명하게 둔다 */
    html, body { background: transparent !important; margin: 0; padding: 0; }
    flutter-view { background: transparent !important; }
  </style>
</head>

<body>
  <script>
    /*
     * window.llaiAudio : 위젯을 단독으로 열었을 때 강의 음성을 백엔드 WebSocket(/ws/audio/{id})으로 보낸다.
     * (크롬 확장에서는 확장의 offscreen 문서가 탭 오디오를 보내므로 쓰지 않는다)
     *
     *   llaiAudio.start('mic' | 'tab' | 'youtube', wsUrl) → Promise
     *     mic     : 마이크 입력
     *     tab     : 화면/탭 공유의 오디오 (공유 창에서 "오디오 공유" 체크 필요)
     *     youtube : 서버가 영상 오디오를 직접 받는다. 브라우저는 연결만 유지
     *   llaiAudio.stop()
     *
     * 오디오는 AudioContext(16kHz)로 리샘플한 뒤 Int16 Little-Endian PCM 바이너리로 보낸다.
     * 15초마다 "ping"을 보내 연결을 확인하고, 끊기면 1·2·4·8·10초 간격으로 다시 연결한다.
     * 상태는 window.postMessage({source:'llai-audio', state, message}) 로 Flutter에 알린다.
     */
    window.llaiAudio = (() => {
      let ws = null, stream = null, ctx = null, source = null, proc = null, mute = null;
      let mode = null, wsUrl = null, active = false, retry = 0, pingTimer = null, retryTimer = null;

      const post = (state, message = '') =>
        window.postMessage({ source: 'llai-audio', state, mode, message }, '*');

      function openSocket() {
        ws = new WebSocket(wsUrl);
        ws.binaryType = 'arraybuffer';
        ws.onopen = () => {
          retry = 0;
          post('connected');
          clearInterval(pingTimer);
          pingTimer = setInterval(() => { if (ws && ws.readyState === WebSocket.OPEN) ws.send('ping'); }, 15000);
        };
        ws.onmessage = (event) => {
          if (typeof event.data !== 'string') return;
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'youtube_ended') { active = false; post('ended'); }
            if (msg.type === 'error') post('error', msg.message || '서버 오류');
          } catch (_) { /* pong 등 */ }
        };
        ws.onclose = (event) => {
          clearInterval(pingTimer);
          if (!active) return;
          if (event.code === 4000 || event.code === 4001) {
            post('error', '서버가 연결을 거부했습니다 (강의 ID 또는 유튜브 주소 확인).');
            stop(true);
            return;
          }
          retry += 1;
          const delay = Math.min(10000, 1000 * 2 ** (retry - 1));
          post('reconnecting', `${Math.round(delay / 1000)}초 후 다시 연결`);
          retryTimer = setTimeout(() => { if (active) openSocket(); }, delay);
        };
      }

      async function start(newMode, url) {
        stop(true);
        mode = newMode; wsUrl = url; active = true;
        try {
          if (mode === 'mic') {
            stream = await navigator.mediaDevices.getUserMedia({
              audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
            });
          } else if (mode === 'tab') {
            stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            if (!stream.getAudioTracks().length) {
              throw new Error('공유 창에서 "오디오 공유"를 켜 주세요.');
            }
            stream.getVideoTracks().forEach((t) => { t.onended = () => stop(); });
          }

          if (stream) {
            ctx = new AudioContext({ sampleRate: 16000 });
            // 권한 창을 거치느라 클릭 직후가 아니면 suspended 로 만들어질 수 있다
            if (ctx.state === 'suspended') await ctx.resume();
            source = ctx.createMediaStreamSource(stream);
            proc = ctx.createScriptProcessor(4096, 1, 1);
            mute = ctx.createGain();
            mute.gain.value = 0;   // 처리용 노드만 연결하고 소리는 다시 내보내지 않는다
            proc.onaudioprocess = (e) => {
              if (!ws || ws.readyState !== WebSocket.OPEN) return;
              const input = e.inputBuffer.getChannelData(0);
              const pcm = new Int16Array(input.length);
              for (let i = 0; i < input.length; i++) {
                const s = Math.max(-1, Math.min(1, input[i]));
                pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
              }
              ws.send(pcm.buffer);
            };
            source.connect(proc);
            proc.connect(mute);
            mute.connect(ctx.destination);
            stream.getAudioTracks().forEach((t) => { t.onended = () => stop(); });
          }
          openSocket();
        } catch (err) {
          stop(true);
          const message = err && err.name === 'NotAllowedError'
            ? '권한이 거부되었거나 공유가 취소되었습니다.'
            : (err && err.message) || String(err);
          post('error', message);
          throw new Error(message);
        }
      }

      function stop(silent) {
        const wasActive = active;
        active = false;
        clearInterval(pingTimer); clearTimeout(retryTimer);
        try { proc && proc.disconnect(); } catch (_) {}
        try { source && source.disconnect(); } catch (_) {}
        try { mute && mute.disconnect(); } catch (_) {}
        try { ctx && ctx.close(); } catch (_) {}
        if (stream) stream.getTracks().forEach((t) => t.stop());
        try { ws && ws.close(1000); } catch (_) {}
        ws = stream = ctx = source = proc = mute = null;
        if (!silent && wasActive) post('stopped');
      }

      return { start, stop: () => stop(false) };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
