<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lecture-Hunter · 인터랙티브 시연</title>
<style>
:root { --sage:#779586;--sage-dark:#496e59;--sage-soft:#e8eee9;--cream:#f5f3f0;--border:#e7e5e1;--ink:#252525;--secondary:#77746f;--width:420px;--height:640px;--opacity:1;--scale:1 }
*{box-sizing:border-box} html,body{margin:0;min-height:100%;}body{background:#171717;color:var(--ink);font-family:Inter, -apple-system, BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sage);outline-offset:2px}button:disabled{cursor:default;opacity:.7}
.stage{min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:24px 16px;overflow:auto}.widget{width:var(--width);height:var(--height);flex:none;background:rgba(255,255,255,var(--opacity));border:1px solid var(--border);border-radius:19px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px #0002;transition:width .14s ease,height .14s ease,background .14s ease;color:var(--ink);font-size:calc(14px * var(--scale));}
.widget *{min-width:0}.header{padding:14px 15px 0;border-bottom:1px solid var(--border);flex:none}.identity{display:flex;align-items:center;gap:9px;margin-bottom:15px}.mark{width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:var(--sage-soft);color:var(--sage-dark);display:grid;place-items:center}.mark svg{width:21px;height:21px}.brand-title{font-size:1.15em;line-height:1.25;letter-spacing:-.3px;font-weight:730}.tagline{font-size:.66em;line-height:1.4;color:#96928e;margin-top:1px}.minimize{margin-left:auto;padding:0 5px;font-size:23px;line-height:30px;color:#6f6e6b;background:transparent;border:0;align-self:start}.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;padding-bottom:14px}.tab{height:38px;border:1px solid var(--border);border-radius:10px;background:var(--cream);color:var(--secondary);font-size:.9em}.tab.active,.subtab.active{color:var(--sage-dark);background:var(--sage-soft);border-color:var(--sage);font-weight:650}.tab:hover,.subtab:hover,.outline-action:hover{border-color:var(--sage)}
.content{flex:1;min-height:0;padding:20px 15px 18px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#d7d6d3 transparent}.content::-webkit-scrollbar{width:4px}.content::-webkit-scrollbar-thumb{background:#d7d6d3;border-radius:8px}.content[data-screen="captions"]{padding-top:24px}.content[data-screen="notices"]{padding-top:15px}.content[data-screen="summary"]{padding:19px 14px}.content[data-screen="settings"]{padding-top:19px}
svg.ico{height:1.1em;width:1.1em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.1em}.subnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.subtab{height:44px;border:1px solid var(--border);border-radius:10px;background:var(--cream);font-size:1em;color:#85817b}
/* captions */.caption-heading{display:flex;align-items:center;justify-content:space-between;margin:0 0 15px}.caption-heading h2{font-size:1.25em;line-height:1.4;letter-spacing:-.02em;margin:0}.caption-status{display:flex;align-items:center;gap:5px;color:var(--sage-dark);font-size:.79em;white-space:nowrap}.status-dot{width:9px;height:9px;border-radius:50%;background:var(--sage-dark)}.language-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}.lang{height:48px;background:var(--cream);border:1px solid var(--border);border-radius:10px;font-size:1em;color:var(--secondary)}.lang.active{background:var(--sage-soft);color:var(--sage-dark);font-weight:660;border-color:var(--sage)}.caption-original{background:var(--cream);border-radius:15px;padding:17px 14px;min-height:134px;margin-bottom:16px}.caption-card-heading{font-weight:700;font-size:1.04em;margin-bottom:7px;color:var(--secondary)}.caption-original p{color:#575650;line-height:1.7;margin:0;font-size:.94em}.caption-translation{border:1px solid var(--sage);border-radius:15px;min-height:175px;padding:17px 14px}.caption-translation .caption-card-heading{color:var(--sage-dark);font-size:1.1em}.caption-translation p{margin:13px 0 0;color:var(--ink);line-height:1.65;font-weight:650;font-size:1.13em}
/* question */.question-textarea{border:none;outline:none;display:block;resize:none;width:100%;height:130px;background:var(--cream);border-radius:15px;color:var(--ink);padding:15px 14px;font-size:.97em;line-height:1.6}.question-textarea::placeholder,.glossary-input::placeholder{color:#8c8984}.action{width:100%;height:44px;border-radius:10px;background:var(--sage-soft);color:var(--sage-dark);border:1px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:600;font-size:1em}.action.outline-action{background:#fff;border:1px solid var(--border);font-weight:500}.capture-action{margin-top:10px;margin-bottom:9px}.action.success-action{background:var(--sage-soft)}.attached{font-size:.79em;color:var(--sage-dark);text-align:right;padding-top:8px}.hidden-file{display:none}
/* glossary */.glossary-heading{font-size:1.1em;font-weight:750;margin:0 0 10px}.glossary-search{display:flex;gap:7px;margin-bottom:15px}.glossary-input{flex:1;min-width:0;border:1px solid var(--border);border-radius:10px;height:40px;background:#fff;padding:0 12px;color:var(--ink);outline-color:var(--sage)}.search-button{height:40px;width:40px;flex:0 0 40px;border:0;border-radius:10px;background:var(--sage);color:white;display:grid;place-items:center}.search-button svg{width:19px;height:19px}.glossary-result{background:var(--cream);border-radius:14px;padding:15px 13px;min-height:143px}.glossary-result h3{font-size:1em;margin:0 0 16px;font-weight:740}.glossary-result .description{margin:0 0 17px;line-height:1.65;font-size:.91em;color:#69655f}.glossary-result .source{padding-top:12px;border-top:1px solid var(--border);font-size:.83em;color:#88837e}.glossary-extra{margin-top:10px}.expanded-text{padding:11px 12px;font-size:.91em;line-height:1.6;background:var(--sage-soft);border-radius:10px;margin-top:10px}
/* notice */.notice-feature{background:var(--sage-soft);border-radius:15px;min-height:80px;padding:15px 13px;margin-bottom:13px}.notice-title{display:flex;align-items:center;gap:6px;color:var(--sage-dark);font-size:1.05em;font-weight:750;margin:0 0 9px}.notice-feature p{margin:0;font-size:.86em;line-height:1.55;color:#5d5a55}.notice-box{border:1px solid var(--border);background:#fff;border-radius:15px;padding:14px 13px;margin-bottom:13px}.notice-box .notice-title{margin-bottom:11px}.notice-item{padding:0 0 10px;margin-bottom:10px;border-bottom:1px solid var(--border)}.notice-item:last-child{padding-bottom:0;margin-bottom:0;border-bottom:0}.notice-item h3{font-size:.92em;font-weight:730;margin:0 0 4px;color:var(--ink);line-height:1.3}.notice-item p{font-size:.82em;color:#88837e;margin:0;line-height:1.45}.notice-item-flex{display:flex;justify-content:space-between;align-items:center;gap:4px}.notice-link{border:0;color:var(--secondary);background:none;padding:2px;display:flex;align-items:center}
/* summary */.timebox{border:1px solid var(--border);border-radius:15px;padding:15px 13px 16px}.time-head{display:flex;align-items:baseline;gap:6px}.time-head strong{font-size:1.05em}.time-head .elapsed{color:#88837e;font-size:.82em}.time-head .unit-hint{margin-left:auto;color:#8a8580;font-size:.82em}.time-groups{display:grid;grid-template-columns:1fr 1fr;gap:27px;margin-top:15px}.time-label{display:block;color:#88837e;font-size:.88em;margin-bottom:7px}.time-pair{display:grid;grid-template-columns:minmax(0,1fr) 12px minmax(0,1fr);gap:5px;align-items:center}.time-pair b{text-align:center;font-size:1.3em;font-weight:700}.time-pair input{min-width:0;width:100%;height:42px;text-align:center;background:#fff;border:1px solid var(--border);border-radius:10px;color:#817d78;font-size:1.15em;appearance:textfield;-moz-appearance:textfield}.time-pair input::-webkit-outer-spin-button,.time-pair input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.time-pair input:focus{border-color:var(--sage);outline:0}.presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:11px 0 14px}.preset{height:43px;border-radius:10px;background:var(--cream);border:1px solid var(--border);color:#85817b;font-size:.86em}.preset.active{background:var(--sage-soft);color:var(--sage-dark);font-weight:680;border-color:var(--sage)}.summary-action{background:var(--sage);color:white;border-radius:13px;font-size:1.1em;font-weight:750;height:44px;margin:0 0 11px}.summary-result{border:1px solid var(--border);border-radius:15px;min-height:145px;padding:13px 12px}.summary-result h3{margin:0;font-size:1.03em;font-weight:720;padding-bottom:12px;border-bottom:1px solid var(--border)}.summary-result p{font-size:.86em;line-height:1.7;color:#85817b;margin-top:10px}.summary-result.filled p{color:#55534f}.summary-error{margin-top:8px;color:#a94442;font-size:.8em}
/* settings */.settings-card{background:var(--cream);border-radius:15px;padding:14px 16px 12px}.settings-item{padding:3px 0 15px;border-bottom:1px solid var(--border);margin-bottom:16px}.settings-item:last-child{border:0;padding-bottom:11px;margin-bottom:0}.settings-label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.98em;font-weight:730}.settings-number{display:flex;align-items:baseline;justify-content:flex-end;gap:1px;color:var(--sage-dark);font-weight:750}.settings-number input{width:55px;min-width:0;display:inline-block;text-align:right;background:transparent;border:1px solid transparent;border-radius:4px;color:inherit;font-weight:inherit;font-size:1em;padding:3px 1px;appearance:textfield;-moz-appearance:textfield}.settings-number input:hover,.settings-number input:focus{background:white;border-color:var(--sage);outline:none}.settings-number input::-webkit-outer-spin-button,.settings-number input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.range{display:block;appearance:none;-webkit-appearance:none;width:100%;height:4px;background:linear-gradient(to right,var(--sage) 0,var(--sage) var(--fill),#dedbd7 var(--fill),#dedbd7 100%);margin:22px 0 0;border-radius:99px;cursor:pointer;outline:none}.range::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:15px;height:15px;background:#fff;border:1.5px solid var(--sage);border-radius:50%}.range::-moz-range-thumb{width:12px;height:12px;background:#fff;border:1.5px solid var(--sage);border-radius:50%}
/* minimization */.collapsed{height:53px!important}.collapsed .header,.collapsed .content{display:none}.restore{display:none}.collapsed .restore{display:flex;align-items:center;justify-content:space-between;padding:0 15px;width:100%;background:transparent;border:0;color:var(--sage-dark);font-weight:700;cursor:pointer}
/* demo confirmation */.toast{position:fixed;bottom:19px;left:50%;transform:translate(-50%,20px);z-index:10;background:#2c332d;color:#fff;border-radius:8px;padding:9px 14px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;white-space:normal}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:440px){.stage{padding:10px;justify-content:flex-start;align-items:center;flex-direction:column}.widget{max-width:calc(100vw - 20px)}.time-groups{gap:13px}.header{padding-left:12px;padding-right:12px}.content{padding-left:12px;padding-right:12px}.nav{gap:5px}.presets{gap:5px}.tagline{font-size:.62em}}
@media(max-height:720px) and (min-width:441px){.stage{align-items:flex-start}}
</style></head><body>
<div class="stage"><main class="widget" id="widget" aria-label="Lecture-Hunter 시연 위젯">
<header class="header"><div class="identity"><span class="mark" id="mark"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:21px;height:21px"><path d="M4.5 3.5h15v13.5h-10l-5 4V3.5Z"/><path d="M8 8h8M8 12h6"/></svg></span><div><div class="brand-title">Lecture-Hunter</div><div class="tagline">강의가 조금 더 쉬워지는 그날까지</div></div><button class="minimize" id="minimize" aria-label="위젯 최소화">−</button></div><nav class="nav" id="nav" aria-label="메인 탭"><button class="tab active" data-tab="자막">자막</button><button class="tab " data-tab="질문">질문</button><button class="tab " data-tab="공지">공지</button><button class="tab " data-tab="요약">요약</button><button class="tab " data-tab="설정">설정</button></nav></header>
<section id="content" class="content" data-screen="captions" aria-live="polite"><div class="caption-heading"><h2>실시간 자막</h2><span class="caption-status"><span class="status-dot"></span>연결 상태 표시</span></div>
<div class="language-row"><button class="lang" data-lang="EN">🇺🇸 EN</button><button class="lang active" data-lang="KR">🇰🇷 KR</button><button class="lang" data-lang="CN">🇨🇳 CN</button></div>
<div class="caption-original"><div class="caption-card-heading">원문</div><p>강의 원문 자막이 여기에 표시됩니다.</p></div>
<div class="caption-translation"><div class="caption-card-heading">한국어 자막</div><p>번역된 한국어 자막이 여기에 표시됩니다.</p></div>
<noscript><p style="margin-top:12px;padding:11px;background:#fff0d7;border-radius:8px;color:#5c4824;font-size:12px;line-height:1.6">현재 파일 미리보기에서는 버튼이 동작하지 않습니다. Mac에서 다운로드한 HTML 파일을 Chrome으로 열거나, 웹사이트로 게시된 주소를 Safari에서 열어 주세요.</p></noscript></section>
<button class="restore" id="restore">Lecture-Hunter <span>펼치기 +</span></button>
</main></div><div role="status" class="toast" id="toast"></div><input class="hidden-file" type="file" accept="image/*" id="attachmentFile">
<script>
'use strict';
const icons={
 logo:'<path d="M4.5 3.5h15v13.5h-10l-5 4V3.5Z"/><path d="M8 8h8M8 12h6"/>',
 send:'<path d="m22 2-7 20-4-9-9-4 20-7Z"/><path d="M22 2 11 13"/>',
 check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
 image:'<rect x="3" y="3" width="15" height="15" rx="2"/><path d="m5.5 15 4-4 3 3 2-2 3.5 3.5"/><path d="M21 3v6M18 6h6"/>',
 search:'<circle cx="10.8" cy="10.8" r="7.2"/><path d="m16 16 5 5"/>',
 book:'<path d="M12 6c-2.6-2.2-6.3-2.4-10-1.3v14c3.7-1.1 7.4-.9 10 1.3 2.6-2.2 6.3-2.4 10-1.3v-14C18.3 3.6 14.6 3.8 12 6ZM12 6v14"/>',
 pin:'<path d="m15 3 6 6-4 1-4.5 4.5.5 5-2 2-3.5-8-6-3 2-2 5 .5L13 5Z"/>',
 clipboard:'<rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4.5V3h6v1.5M9 10h6M9 14h6M9 18h4"/>',
 external:'<path d="M12 5H5v14h14v-7M13 3h8v8M21 3l-10 10"/>',
 translate:'<path d="M4 5h12M10 3v2M7 9c2 5 5 7 9 9M14 7c-1 5-5 9-10 11"/><path d="m15 20 3-8 3 8M16 17h4"/>',
 alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/>'
};
function icon(name,additional=''){return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" ${additional}>${icons[name]}</svg>`}
function el(id){return document.getElementById(id)}
function safe(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const state={tab:'자막',lang:'KR',questionSub:'익명 질문',questionText:'',questionSuccess:false,attachmentName:'',term:'',termSearched:false,detail:false,period:'직접 선택',startH:'00',startM:'00',endH:'00',endM:'00',summaryDone:false,summaryError:'',opacity:100,width:420,height:640,textSize:100};
const tabs=['자막','질문','공지','요약','설정'];
function notify(str){const t=el('toast'); t.textContent=str;t.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.remove('show'),2800)}
function applySettings(){const w=el('widget');w.style.setProperty('--width',state.width+'px');w.style.setProperty('--height',state.height+'px');w.style.setProperty('--opacity',state.opacity/100);w.style.setProperty('--scale',state.textSize/100)}
function renderNav(){el('nav').innerHTML=tabs.map(t=>`<button class="tab ${state.tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');el('nav').querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;render()}))}
function renderCaption(){const l={KR:{orig:'원문',trans:'한국어 자막',origText:'강의 원문 자막이 여기에 표시됩니다.',transText:'번역된 한국어 자막이 여기에 표시됩니다.'},EN:{orig:'Original',trans:'English Captions',origText:'강의 원문 자막이 여기에 표시됩니다.',transText:'The translated captions will appear here.'},CN:{orig:'原文',trans:'中文字幕',origText:'강의 원문 자막이 여기에 표시됩니다.',transText:'翻译后的中文字幕将显示在这里。'}}[state.lang];return `<div class="caption-heading"><h2>실시간 자막</h2><span class="caption-status"><span class="status-dot"></span>연결 상태 표시</span></div><div class="language-row"><button class="lang ${state.lang==='EN'?'active':''}" data-lang="EN">🇺🇸 EN</button><button class="lang ${state.lang==='KR'?'active':''}" data-lang="KR">🇰🇷 KR</button><button class="lang ${state.lang==='CN'?'active':''}" data-lang="CN">🇨🇳 CN</button></div><div class="caption-original"><div class="caption-card-heading">${l.orig}</div><p>${l.origText}</p></div><div class="caption-translation"><div class="caption-card-heading">${icon('translate')} ${l.trans}</div><p>${l.transText}</p></div>`}
function questionTabs(){return `<div class="subnav"><button class="subtab ${state.questionSub==='익명 질문'?'active':''}" data-question-tab="익명 질문">익명 질문</button><button class="subtab ${state.questionSub==='용어집 조회'?'active':''}" data-question-tab="용어집 조회">용어집 조회</button></div>`}
function renderQuestion(){return state.questionSub==='익명 질문'?`${questionTabs()}<textarea class="question-textarea" id="questionText" placeholder="궁금한 내용을 입력하세요.">${safe(state.questionText)}</textarea><button class="action outline-action capture-action" id="capture">${icon('image')} ${state.attachmentName?'화면 캡처 첨부됨':'화면 캡처'}</button><button class="action ${state.questionSuccess?'success-action':''}" id="submitQuestion">${icon(state.questionSuccess?'check':'send')}${state.questionSuccess?'질문이 전송되었습니다.':'질문 전송'}</button>${state.attachmentName?`<div class="attached">첨부: ${safe(state.attachmentName)}</div>`:''}`:`${questionTabs()}<h2 class="glossary-heading">용어집 조회</h2><div class="glossary-search"><input id="termInput" class="glossary-input" placeholder="조회할 용어를 입력하세요." value="${safe(state.term)}"><button class="search-button" id="termSearch" aria-label="용어 검색">${icon('search')}</button></div>${renderGlossaryResult()}<button class="action outline-action glossary-extra" id="moreDetail">추가 설명 요청</button>${state.detail?`<div class="expanded-text">${state.termSearched?'더 자세한 설명 요청을 선택했습니다. 실제 AI 답변은 서버 연결 시 제공됩니다.':'검색할 용어를 입력하면 관련 설명을 요청할 수 있습니다.'}</div>`:''}`}
const dictionary={
 '역전파':['역전파 (Backpropagation)','신경망에서 오차를 출력층부터 이전 층으로 전달하면서 각 가중치의 기울기를 계산하는 방법입니다.','내부 용어집 · 시연용'],
 '딥러닝':['딥러닝 (Deep Learning)','여러 층으로 구성된 인공신경망으로 데이터의 특징과 패턴을 학습하는 기계학습 방법입니다.','내부 용어집 · 시연용'],
 '인공지능':['인공지능 (Artificial Intelligence)','컴퓨터가 학습과 추론 등의 지능적 작업을 수행하도록 만드는 기술 분야입니다.','내부 용어집 · 시연용'],
 '기계학습':['기계학습 (Machine Learning)','데이터에서 패턴을 학습하여 예측이나 분류를 수행하는 방법입니다.','내부 용어집 · 시연용'],
 '자연어처리':['자연어처리 (NLP)','컴퓨터가 사람의 언어를 분석하고 이해하거나 생성하도록 하는 기술입니다.','내부 용어집 · 시연용'],
 '손실 함수':['손실 함수 (Loss Function)','예측값과 정답 사이의 오차를 수치로 나타내는 함수입니다.','내부 용어집 · 시연용']};
function renderGlossaryResult(){let title='용어 설명',description='조회한 용어의 핵심 설명과 요약이 표시됩니다.',source='출처 · 관련 정보';if(state.termSearched){let term=state.term.trim();let item=dictionary[term];if(item){[title,description,source]=item}else if(term){title='조회 결과 없음';description=`내부 용어집에서 “${term}”에 해당하는 항목을 찾지 못했습니다.`;source='출처 · 내부 용어집'}else{title='용어 설명';description='조회할 용어를 입력하세요.';source='출처 · 관련 정보'}}return `<article class="glossary-result"><h3>${safe(title)}</h3><p class="description">${safe(description)}</p><div class="source">${safe(source)}</div></article>`}
function renderNotices(){return `<section class="notice-feature"><h2 class="notice-title">${icon('pin')} 중요 공지</h2><p>이번 강의에서 우선적으로 알아야 할 내용과 학습 방향을 안내합니다.</p></section><section class="notice-box"><h2 class="notice-title">${icon('book')} 교재 및 참고 자료</h2><div class="notice-item"><h3>추천 교재</h3><p>교재명 · 저자 · 출판사 · 참고 범위</p></div><div class="notice-item"><div class="notice-item-flex"><h3>추가 참고 자료</h3><button class="notice-link" id="sourceInfo" aria-label="출처 안내">${icon('external')}</button></div><p>자료 제목 · 발행기관 · 출처 링크</p></div><div class="notice-item"><h3>필요한 학습 환경</h3><p>프로그램 · 개발 환경 · 설치 안내</p></div></section><section class="notice-box"><h2 class="notice-title">${icon('clipboard')} 과제 안내</h2><div class="notice-item"><h3>과제 설명</h3><p>과제명 · 수행 내용 · 요구사항</p></div><div class="notice-item"><h3>제출 방법</h3><p>제출 플랫폼 · 파일 형식 · 제출 절차</p></div><div class="notice-item"><h3>제출 기한</h3><p>제출 마감 날짜 및 시간</p></div></section>`}
const pad2=n=>String(Math.max(0,n)).padStart(2,'0');
function timePair(which){return `<label class="time-label" for="${which}H">${which==='start'?'시작 시간':'종료 시간'}</label><div class="time-pair"><input type="text" inputmode="numeric" pattern="[0-9]*" id="${which}H" value="${safe(state[which+'H'])}" aria-label="${which==='start'?'시작':'종료'} 시"><b>:</b><input type="text" inputmode="numeric" pattern="[0-9]*" id="${which}M" value="${safe(state[which+'M'])}" aria-label="${which==='start'?'시작':'종료'} 분"></div>`}
function renderSummary(){return `<section class="timebox"><div class="time-head"><strong>요약할 시간 설정</strong><span class="elapsed">강의 경과 00:00</span><span class="unit-hint">시 : 분</span></div><div class="time-groups"><div>${timePair('start')}</div><div>${timePair('end')}</div></div></section><div class="presets">${['전체 구간','최근 10분','최근 30분','직접 선택'].map(k=>`<button class="preset ${state.period===k?'active':''}" data-period="${k}">${k}</button>`).join('')}</div><button class="action summary-action" id="generateSummary">요약하기</button><section class="summary-result ${state.summaryDone?'filled':''}"><h3>AI 요약 결과</h3>${state.summaryDone?`<p><strong>${safe(state.startH)}:${safe(state.startM)} ~ ${safe(state.endH)}:${safe(state.endM)}</strong> 구간의 시연용 요약입니다.<br>• 신경망의 학습 구조와 핵심 개념<br>• 손실 함수와 오차 계산<br>• 역전파를 통한 가중치 업데이트</p>`:'<p>선택한 구간의 핵심 내용이 여기에 표시됩니다.</p>'}</section>${state.summaryError?`<div class="summary-error">${safe(state.summaryError)}</div>`:''}`}
const options=[{id:'opacity',label:'불투명도',unit:'%',min:0,max:100},{id:'width',label:'너비',unit:'px',min:280,max:700},{id:'height',label:'높이',unit:'px',min:400,max:950},{id:'textSize',label:'전체 글자 크기',unit:'%',min:60,max:180}];
function renderSettings(){return `<div class="settings-card">${options.map(o=>`<div class="settings-item"><div class="settings-label"><label for="slider-${o.id}">${o.label}</label><div class="settings-number"><input id="number-${o.id}" type="number" inputmode="numeric" min="${o.min}" max="${o.max}" value="${state[o.id]}" aria-label="${o.label} 직접 입력"><span>${o.unit}</span></div></div><input class="range" type="range" id="slider-${o.id}" min="${o.min}" max="${o.max}" step="1" value="${state[o.id]}" style="--fill:${(state[o.id]-o.min)/(o.max-o.min)*100}%" aria-label="${o.label} 슬라이더"></div>`).join('')}</div>`}
function render(){renderNav();let panel=el('content');panel.dataset.screen={자막:'captions',질문:'question',공지:'notices',요약:'summary',설정:'settings'}[state.tab];panel.innerHTML=({자막:renderCaption,질문:renderQuestion,공지:renderNotices,요약:renderSummary,설정:renderSettings}[state.tab])();bind();applySettings()}
let successTimer;
function bind(){
 document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;render()});
 document.querySelectorAll('[data-question-tab]').forEach(b=>b.onclick=()=>{state.questionSub=b.dataset.questionTab;render()});
 let q=el('questionText');if(q){q.oninput=e=>{state.questionText=e.target.value;if(state.questionSuccess){state.questionSuccess=false;el('submitQuestion').innerHTML=icon('send')+'질문 전송'}};el('capture').onclick=async()=>{const f=el('attachmentFile');if(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia){try{const stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});const video=document.createElement('video');video.srcObject=stream;await video.play();await new Promise(r=>setTimeout(r,180));const cv=document.createElement('canvas');cv.width=video.videoWidth;cv.height=video.videoHeight;cv.getContext('2d').drawImage(video,0,0);stream.getTracks().forEach(t=>t.stop());state.attachmentName='화면 캡처';state.captureData=cv.toDataURL('image/png');render();notify('캡처를 첨부했습니다.');return}catch(err){if(err.name==='NotAllowedError'){notify('화면 공유가 취소되었습니다.');return}}}f.click()};el('submitQuestion').onclick=()=>{if(!state.questionText.trim()&&!state.attachmentName){notify('질문을 입력하거나 화면을 첨부해 주세요.');return}state.questionSuccess=true;state.questionText='';state.attachmentName='';state.captureData=null;render();clearTimeout(successTimer);successTimer=setTimeout(()=>{if(state.questionSuccess){state.questionSuccess=false;if(state.tab==='질문'&&state.questionSub==='익명 질문')render()}},2300)}}
 let search=el('termSearch'),term=el('termInput');if(term){term.oninput=e=>state.term=e.target.value;term.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();executeSearch()}};search.onclick=executeSearch;el('moreDetail').onclick=()=>{state.detail=!state.detail;render()}}
 let source=el('sourceInfo');if(source)source.onclick=()=>notify('출처 링크는 실제 강의 공지 데이터 연결 시 열립니다.');
 const submit=el('generateSummary');if(submit){for(let which of ['start','end'])for(let unit of ['H','M']){let input=el(which+unit);input.oninput=e=>{state[which+unit]=e.target.value;state.period='직접 선택';state.summaryDone=false;state.summaryError='';document.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('active',x.dataset.period==='직접 선택'))};input.onblur=e=>{let val=parseInt(e.target.value,10);if(Number.isFinite(val)&&val>=0&&(unit==='H'||val<=59)){e.target.value=pad2(val);state[which+unit]=pad2(val)}}}
 document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{state.period=b.dataset.period;state.summaryDone=false;state.summaryError='';if(state.period==='전체 구간'){Object.assign(state,{startH:'00',startM:'00',endH:'40',endM:'00'})}else if(state.period==='최근 10분'){Object.assign(state,{startH:'30',startM:'00',endH:'40',endM:'00'})}else if(state.period==='최근 30분'){Object.assign(state,{startH:'10',startM:'00',endH:'40',endM:'00'})}render();if(state.period!=='직접 선택')notify('시연용 강의 길이 40분을 기준으로 선택했습니다.')});submit.onclick=()=>{for(let which of ['start','end'])for(let unit of ['H','M'])state[which+unit]=el(which+unit).value.trim();let vals=[state.startH,state.startM,state.endH,state.endM].map(x=>Number(x));if(vals.some((x,i)=>!Number.isInteger(x)||x<0||(i%2===1&&x>59))){state.summaryError='시·분 값을 올바르게 입력해 주세요. (분은 0~59)';state.summaryDone=false;render();return}if(vals[2]*60+vals[3]<=vals[0]*60+vals[1]){state.summaryError='종료 시간은 시작 시간보다 늦어야 합니다.';state.summaryDone=false;render();return}for(let which of ['start','end'])for(let unit of ['H','M'])state[which+unit]=pad2(Number(state[which+unit]));state.summaryDone=true;state.summaryError='';render()}}
 for(const o of options){const slider=el('slider-'+o.id),num=el('number-'+o.id);if(!slider)continue;slider.oninput=e=>updateSetting(o,Number(e.target.value));num.oninput=e=>{if(e.target.value==='')return;const val=Number(e.target.value);if(!Number.isFinite(val))return;updateSetting(o,val,false)};num.onchange=e=>{let val=Number(e.target.value);if(!Number.isFinite(val))val=state[o.id];updateSetting(o,val,true)}}
}
function executeSearch(){state.termSearched=true;state.detail=false;render()}
function updateSetting(o,val,updateNum=true){const v=Math.round(Math.min(o.max,Math.max(o.min,val)));state[o.id]=v;const slide=el('slider-'+o.id),num=el('number-'+o.id);if(slide){slide.value=v;slide.style.setProperty('--fill',((v-o.min)/(o.max-o.min)*100)+'%')}if(num&&updateNum)num.value=v;applySettings()}
el('mark').innerHTML=icon('logo');
el('minimize').onclick=()=>el('widget').classList.add('collapsed');el('restore').onclick=()=>el('widget').classList.remove('collapsed');
el('attachmentFile').addEventListener('change',e=>{let f=e.target.files[0];if(f){state.attachmentName=f.name;render();notify('이미지를 첨부했습니다.')}e.target.value=''});
render();
</script></body></html>
